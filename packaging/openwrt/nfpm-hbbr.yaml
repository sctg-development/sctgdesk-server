# OpenWrt package (apk) of hbbr from the static musl binary (see .github/workflows/packages.yml).
# Environment: VERSION, NFPM_ARCH (the OpenWrt architecture, for example aarch64_generic or mips_24kc: the repository
# of a release is per architecture), BIN_DIR (folder with the binaries).
name: sctgdesk-server-hbbr
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: SCTG Development
vendor: SCTG Development
homepage: https://github.com/sctg-development/sctgdesk-server
license: AGPL-3.0-only
description: |
  SCTGDesk relay server for OpenWrt.
  The binary is static (musl): it needs no library of the system. Options: /etc/config/sctgdesk-hbbr.
contents:
  - src: ${BIN_DIR}/hbbr
    expand: true
    dst: /usr/bin/hbbr
    file_info:
      mode: 0755
  - src: packaging/openwrt/hbbr.init
    dst: /etc/init.d/sctgdesk-hbbr
    file_info:
      mode: 0755
  - src: packaging/openwrt/hbbr.config
    dst: /etc/config/sctgdesk-hbbr
    type: config|noreplace
    file_info:
      mode: 0600
scripts:
  postinstall: packaging/openwrt/hbbr.postinstall.sh
  preremove: packaging/openwrt/hbbr.preremove.sh
