# OpenWrt package (apk) of rustdesk-utils from the static musl binary. Environment: VERSION, NFPM_ARCH, BIN_DIR.
name: sctgdesk-server-utils
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: SCTG Development
vendor: SCTG Development
homepage: https://github.com/sctg-development/sctgdesk-server
license: AGPL-3.0-only
description: |
  Tools of the SCTGDesk server for OpenWrt: rustdesk-utils (key pair generation and validation, diagnostics).
contents:
  - src: ${BIN_DIR}/rustdesk-utils
    expand: true
    dst: /usr/bin/rustdesk-utils
    file_info:
      mode: 0755
