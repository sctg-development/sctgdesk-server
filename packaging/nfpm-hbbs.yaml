# deb and rpm of hbbs from the static musl binary (see .github/workflows/packages.yml).
# Environment: VERSION (for example 1.1.16-sctg.3), NFPM_ARCH (amd64 or arm64), BIN_DIR (folder with the binaries).
name: sctgdesk-server-hbbs
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: SCTG Development
vendor: SCTG Development
homepage: https://github.com/sctg-development/sctgdesk-server
license: AGPL-3.0-only
description: |
  SCTGDesk signal server (hbbs) with its API server: the ID and rendezvous server of RustDesk-compatible clients, with address books, OAuth2 login and software update links.
  Self-host your own RustDesk-compatible server. The binary is static (musl): it needs no library of the system.
replaces:
  - rustdesk-server-hbbs
conflicts:
  - rustdesk-server-hbbs
contents:
  - src: ${BIN_DIR}/hbbs
    expand: true
    dst: /usr/bin/hbbs
    file_info:
      mode: 0755
  - src: systemd/rustdesk-hbbs.service
    dst: /usr/lib/systemd/system/rustdesk-hbbs.service
    file_info:
      mode: 0644
  - dst: /var/lib/rustdesk-server
    type: dir
    file_info:
      mode: 0755
  - dst: /var/log/rustdesk-server
    type: dir
    file_info:
      mode: 0755
scripts:
  postinstall: packaging/hbbs.postinstall.sh
  preremove: packaging/hbbs.preremove.sh
