[package]
name = "s3software"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# No default features: they enable the legacy hyper 0.14 / rustls 0.21 client (h2 0.3, webpki 0.101, all with
# open advisories), the aws-lc-rs provider (a second rustls provider next to the ring one used everywhere else:
# rustls then refuses to pick one at run time, and aws-lc-sys needs a C toolchain on every target) and SigV4a
# (multi-region access points, not used here). The HTTPS client is built in code, on ring.
aws-config = { version = "1.3", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.25", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
log = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }