name: Client build (Windows)

# The Windows clients of the SCTGDesk brand: upstream RustDesk at client/UPSTREAM_TAG, our patches,
# overlay and branding (client/README.md), built the way upstream builds its own (flutter-build.yml of the
# same tag), then signed and packed in one portable .exe each:
# - 64 bit: Flutter (job build-for-windows-flutter, x86_64),
# - 32 bit: Sciter, as Flutter does not exist for Windows x86 (job build-for-windows-sciter, i686).
#
# - On a pull request touching this build it builds only.
# - By hand it also copies the .exe files to S3, as `<app>-<version>-x86_64.exe` and `<app>-<version>-i686.exe`
#   next to the other clients: the download links of the landing page follow (api-s3software, `{version}` keys).
# The result is never a release. Outside a pull request, the files are signed by SignPath, which needs them as
# short-lived (one day) workflow artifacts, downloadable by anyone as this repository is public, although they embed
# the address of the rendezvous server (accepted: the signing is worth it).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Copy the .exe to S3 (it becomes the download of the landing page)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        description: "Copy to S3 (and Cloudflare Pages for the web client)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/client-windows.yml"
      - ".github/workflows/bridge.yml"
      - ".github/workflows/third-party-RustDeskTempTopMostWindow.yml"
      - "client/branding.py"
      - "client/build-sctg.py"
      - "client/apply.sh"
      - "client/UPSTREAM_TAG"
      - "client/patches/**"
      - "client/overlay/**"

permissions:
  contents: read
  actions: read # the SignPath action reads the run and downloads the unsigned artifacts

# a push to the pull request replaces the build that is running: it takes about forty minutes
concurrency:
  group: client-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # the values of flutter-build.yml of upstream 1.5.3 for Windows x64 and x86 (Windows arm64, on Flutter 3.44, is not built)
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # the brand (client/branding.py)
  APP_NAME: ${{ secrets.APP_NAME }}
  APP_NAME_LOW: ${{ secrets.APP_NAME_LOW }}
  ORG_NAME: ${{ secrets.ORG_NAME }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  API_SERVER: ${{ secrets.API_SERVER }}

jobs:
  topmost:
    name: RustDeskTempTopMostWindow
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  bridge:
    name: flutter-rust-bridge
    # bridge.yml asks for `actions: read` (added by a CodeQL suggestion): a called workflow cannot ask for
    # more than its caller grants, and the workflow above only grants `contents: read`
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/bridge.yml

  windows-x64:
    name: windows x86_64
    needs: [topmost, bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout the monorepo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: _mono

      - name: Prepare the client tree (upstream tag + patches + overlay)
        shell: bash
        run: |
          git config --global core.longpaths true
          echo "VERSION=$(tr -d '[:space:]' < _mono/client/UPSTREAM_TAG)" >> "$GITHUB_ENV"
          _mono/client/apply.sh _client
          shopt -s dotglob
          mv _client/* .
          rm -rf _client _mono

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      # build-sctg.py brands the tree (client/branding.py), then runs upstream's build.py
      - name: Build the client
        run: |
          $ErrorActionPreference = 'Stop'
          python3 .\build-sctg.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Runner.rc does not contain the actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # Signing by SignPath (OSS program). It does not take a file from us: it downloads from GitHub the artifact
      # uploaded below, which is how it checks that the files come from this repository and this run. Not done on a
      # pull request (the secrets are not available to forks, and nothing is published from a pull request).
      # WARNING: this repository is public, so these artifacts can be downloaded by anyone for the day they are kept,
      # and the files embed the rendezvous server address and public key.
      # The API token is stored in 1Password; the organisation secret OP_SERVICE_ACCOUNT_TOKEN reads its vault.
      - name: Load the SignPath token from 1Password
        if: ${{ github.event_name != 'pull_request' }}
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIGNPATH_API_TOKEN: op://GitHub SCTG-Development/y7imec4bh6vvscatjhvqstoutq/identifiant

      # First the programs and libraries, then (after the packing) the self-extracting executable that holds them
      # Third-party libraries that already carry a signature (Flutter, Microsoft runtimes, ...) are left as they are:
      # only the files without any signature, ours, are sent to SignPath.
      - name: Select the unsigned client files
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath/to-sign | Out-Null
          foreach ($f in Get-ChildItem "rustdesk/*" -Include *.exe, *.dll) {
            $status = (Get-AuthenticodeSignature $f.FullName).Status
            if ($status -eq 'NotSigned') { Copy-Item $f.FullName signpath/to-sign/ }
            else { Write-Host "left as is ($status): $($f.Name)" }
          }
          Get-ChildItem signpath/to-sign

      - name: Upload the client files for SignPath
        if: ${{ github.event_name != 'pull_request' }}
        id: unsigned_app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-client-files-x64
          path: signpath/to-sign/*
          retention-days: 1
          if-no-files-found: error

      - name: Sign the client files with SignPath
        if: ${{ github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: 3afe2c7a-e2db-4dfc-9cb0-9a77ee8de07e
          project-slug: sctgdesk-server
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned_app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed-files

      # The signed files replace the unsigned ones. rustdesk.exe must carry a valid signature, or the job fails: an
      # unsigned client must not reach S3 by accident.
      - name: Use the signed client files
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item signpath/signed-files/* "rustdesk/" -Force
          $sig = Get-AuthenticodeSignature "rustdesk/rustdesk.exe"
          # release-signing: the chain must be trusted (Valid). test-signing uses an untrusted test certificate, so only
          # check that a signature exists and matches the file.
          $release = "${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}" -eq 'release-signing'
          $ok = if ($release) { $sig.Status -eq 'Valid' } else { $sig.SignerCertificate -and $sig.Status -notin 'NotSigned', 'HashMismatch' }
          if (-not $ok) { throw "rustdesk.exe is not validly signed: $($sig.Status)" }
          Write-Host "rustdesk.exe signed by $($sig.SignerCertificate.Subject)"

      - name: Build the self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          mv ../../rustdesk/rustdesk.exe "../../rustdesk/${APP_NAME}.exe"
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${APP_NAME}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${APP_NAME_LOW}-${VERSION}-x86_64.exe"
          ls -l ./SignOutput

      - name: Upload the self-extracting executable for SignPath
        if: ${{ github.event_name != 'pull_request' }}
        id: unsigned_packer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-client-packer-x64
          path: SignOutput/*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign the self-extracting executable with SignPath
        if: ${{ github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: 3afe2c7a-e2db-4dfc-9cb0-9a77ee8de07e
          project-slug: sctgdesk-server
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned_packer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed-packer

      - name: Use the signed self-extracting executable
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item signpath/signed-packer/*.exe SignOutput/ -Force
          foreach ($f in Get-ChildItem SignOutput/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            # release-signing: the chain must be trusted (Valid). test-signing uses an untrusted test certificate, so only
            # check that a signature exists and matches the file.
            $release = "${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}" -eq 'release-signing'
            $ok = if ($release) { $sig.Status -eq 'Valid' } else { $sig.SignerCertificate -and $sig.Status -notin 'NotSigned', 'HashMismatch' }
            if (-not $ok) { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($f.Name) signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Copy the executable to S3
        if: inputs.publish
        shell: pwsh
        env:
          S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          S3_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          curl.exe -fsSL -o mc.exe https://dl.min.io/aistor/mc/release/windows-amd64/mc.exe
          .\mc.exe alias set s3release "https://$env:S3_ENDPOINT" "$env:S3_KEY" "$env:S3_SECRET"
          .\mc.exe cp ".\SignOutput\$env:APP_NAME_LOW-$env:VERSION-x86_64.exe" "s3release/$env:S3_BUCKET/$env:APP_NAME_LOW-releases/"

  windows-x86:
    name: windows i686 (Sciter)
    runs-on: windows-2022
    env:
      TARGET: i686-pc-windows-msvc
      VCPKG_TRIPLET: x86-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout the monorepo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: _mono

      - name: Prepare the client tree (upstream tag + patches + overlay)
        shell: bash
        run: |
          git config --global core.longpaths true
          echo "VERSION=$(tr -d '[:space:]' < _mono/client/UPSTREAM_TAG)" >> "$GITHUB_ENV"
          _mono/client/apply.sh _client
          shopt -s dotglob
          mv _client/* .
          rm -rf _client _mono

      - name: Install LLVM and Clang (32 bit)
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      # Sciter's abi_thiscall feature requires nightly Rust (upstream's comment). The host toolchain is i686 so
      # that the build scripts can load the 32 bit LLVM above; rustup 1.29.1+ wants --force-non-host for it.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2023-10-13-${TARGET} \
            --target ${TARGET} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-${TARGET} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${VCPKG_TRIPLET} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      # upstream builds this one with cargo directly (not build.py), so the brand is applied first
      - name: Build the client
        shell: bash
        run: |
          python3 branding.py --root .
          python3 res/inline-sciter.py
          # Sciter for x86 is on another branch of the binding
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          # branding.py renames the package, so cargo names the binary after the brand
          mv "./target/release/${APP_NAME_LOW}.exe" ./Release/rustdesk.exe
          curl -fsSLJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -fsSLJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # the x64 deviceinstaller stays: the 32 bit exe cannot install the driver on a 64 bit system
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release

      - name: find Runner.res
        # Runner.rc does not contain the actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      # Signing by SignPath (OSS program). It does not take a file from us: it downloads from GitHub the artifact
      # uploaded below, which is how it checks that the files come from this repository and this run. Not done on a
      # pull request (the secrets are not available to forks, and nothing is published from a pull request).
      # WARNING: this repository is public, so these artifacts can be downloaded by anyone for the day they are kept,
      # and the files embed the rendezvous server address and public key.
      # The API token is stored in 1Password; the organisation secret OP_SERVICE_ACCOUNT_TOKEN reads its vault.
      - name: Load the SignPath token from 1Password
        if: ${{ github.event_name != 'pull_request' }}
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIGNPATH_API_TOKEN: op://GitHub SCTG-Development/y7imec4bh6vvscatjhvqstoutq/identifiant

      # First the programs and libraries, then (after the packing) the self-extracting executable that holds them
      # Third-party libraries that already carry a signature (Flutter, Microsoft runtimes, ...) are left as they are:
      # only the files without any signature, ours, are sent to SignPath.
      - name: Select the unsigned client files
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath/to-sign | Out-Null
          foreach ($f in Get-ChildItem "Release/*" -Include *.exe, *.dll) {
            $status = (Get-AuthenticodeSignature $f.FullName).Status
            if ($status -eq 'NotSigned') { Copy-Item $f.FullName signpath/to-sign/ }
            else { Write-Host "left as is ($status): $($f.Name)" }
          }
          Get-ChildItem signpath/to-sign

      - name: Upload the client files for SignPath
        if: ${{ github.event_name != 'pull_request' }}
        id: unsigned_app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-client-files-x86
          path: signpath/to-sign/*
          retention-days: 1
          if-no-files-found: error

      - name: Sign the client files with SignPath
        if: ${{ github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: 3afe2c7a-e2db-4dfc-9cb0-9a77ee8de07e
          project-slug: sctgdesk-server
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned_app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed-files

      # The signed files replace the unsigned ones. rustdesk.exe must carry a valid signature, or the job fails: an
      # unsigned client must not reach S3 by accident.
      - name: Use the signed client files
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item signpath/signed-files/* "Release/" -Force
          $sig = Get-AuthenticodeSignature "Release/rustdesk.exe"
          # release-signing: the chain must be trusted (Valid). test-signing uses an untrusted test certificate, so only
          # check that a signature exists and matches the file.
          $release = "${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}" -eq 'release-signing'
          $ok = if ($release) { $sig.Status -eq 'Valid' } else { $sig.SignerCertificate -and $sig.Status -notin 'NotSigned', 'HashMismatch' }
          if (-not $ok) { throw "rustdesk.exe is not validly signed: $($sig.Status)" }
          Write-Host "rustdesk.exe signed by $($sig.SignerCertificate.Subject)"

      - name: Build the self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          mv ../../Release/rustdesk.exe "../../Release/${APP_NAME}.exe"
          python3 ./generate.py -f ../../Release/ -o . -e "../../Release/${APP_NAME}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${APP_NAME_LOW}-${VERSION}-i686.exe"
          ls -l ./SignOutput

      - name: Upload the self-extracting executable for SignPath
        if: ${{ github.event_name != 'pull_request' }}
        id: unsigned_packer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-client-packer-x86
          path: SignOutput/*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign the self-extracting executable with SignPath
        if: ${{ github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: 3afe2c7a-e2db-4dfc-9cb0-9a77ee8de07e
          project-slug: sctgdesk-server
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned_packer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed-packer

      - name: Use the signed self-extracting executable
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item signpath/signed-packer/*.exe SignOutput/ -Force
          foreach ($f in Get-ChildItem SignOutput/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            # release-signing: the chain must be trusted (Valid). test-signing uses an untrusted test certificate, so only
            # check that a signature exists and matches the file.
            $release = "${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}" -eq 'release-signing'
            $ok = if ($release) { $sig.Status -eq 'Valid' } else { $sig.SignerCertificate -and $sig.Status -notin 'NotSigned', 'HashMismatch' }
            if (-not $ok) { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($f.Name) signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Copy the executable to S3
        if: inputs.publish
        shell: pwsh
        env:
          S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          S3_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          curl.exe -fsSL -o mc.exe https://dl.min.io/aistor/mc/release/windows-amd64/mc.exe
          .\mc.exe alias set s3release "https://$env:S3_ENDPOINT" "$env:S3_KEY" "$env:S3_SECRET"
          .\mc.exe cp ".\SignOutput\$env:APP_NAME_LOW-$env:VERSION-i686.exe" "s3release/$env:S3_BUCKET/$env:APP_NAME_LOW-releases/"
