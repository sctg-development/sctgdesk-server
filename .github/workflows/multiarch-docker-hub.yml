name: Generate multi-arch Docker image and release linux binaries

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:

jobs:
  image:
    name: Build and push the multi-arch image to Docker Hub (amd64, arm64)
    uses: sctg-development/build-multi-arch-docker-action/.github/workflows/build.yml@v2
    with:
      dockerfile: Dockerfile
      context: .
      image: sctg/sctgdesk-server
      submodules: recursive
      # docker/metadata-action adds `latest` by itself ("latest=auto") for type=ref,event=tag, type=semver and
      # type=match, and the action offers no `flavor` input to turn that off: only raw tags are used here, so that
      # `latest` moves only for a full release, never for a pre-release, a branch or a manual run.
      tags: |
        type=ref,event=branch
        type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
        type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      artifact-prefix: sctgdesk-server-${{ github.run_id }}
      cleanup: false
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  linux-binaries:
    name: Publish the static Linux binaries of the release
    needs: image
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract the binaries from the image
        env:
          DIGEST: ${{ needs.image.outputs.image-digest }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for arch in amd64 arm64; do
            mkdir -p "/tmp/$arch/zip"
            cid=$(docker create --platform "linux/$arch" "sctg/sctgdesk-server@$DIGEST")
            for b in hbbs hbbr rustdesk-utils; do
              docker cp "$cid:/usr/local/bin/$b" "/tmp/$arch/zip/"
            done
            docker rm "$cid"
            (cd "/tmp/$arch/zip" && zip -r "/tmp/$arch/linux_static_${TAG}_${arch}.zip" .)
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for arch in amd64 arm64; do
            gh release upload "$TAG" "/tmp/$arch/linux_static_${TAG}_${arch}.zip" --clobber
          done
      - name: Attest the release files
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "/tmp/*/linux_static_*.zip"
