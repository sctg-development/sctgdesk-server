name: Windows and macOS binaries

# hbbs, hbbr and rustdesk-utils for Windows (amd64, arm64) and macOS (Intel, Apple Silicon), zipped. Run by release.yml when a release is
# published, or by hand.
# Without `publish` it builds and checks the binaries and publishes nothing; with `publish` it also uploads the zip
# files and their SHA-256 sums to the GitHub release of the tag, created as a pre-release when it does not exist yet.
# The Linux packages have their own workflow (packages.yml). A release is a decision of the maintainer
# (docs/releases.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, sctg-v<version> as in Cargo.toml (for example sctg-v1.1.16-sctg.3)"
        required: true
        type: string
      publish:
        description: "Upload the archives to the pre-release of the tag"
        required: false
        default: false
        type: boolean
  # called by release.yml with the tag of the release and publish on
  workflow_call:
    inputs:
      tag:
        description: "Release tag, sctg-v<version> as in Cargo.toml (for example sctg-v1.1.16-sctg.3)"
        required: true
        type: string
      publish:
        description: "Upload the archives to the pre-release of the tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read # the SignPath action reads the run and downloads the unsigned artifact (Windows signing)

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os_name }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: windows, arch: x86_64,  runner: windows-latest, target: x86_64-pc-windows-msvc,  ext: .exe }
          - { os_name: windows, arch: aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, ext: .exe }
          - { os_name: macos,   arch: x86_64,  runner: macos-15-intel, target: x86_64-apple-darwin,     ext: "" }
          - { os_name: macos,   arch: aarch64, runner: macos-15,       target: aarch64-apple-darwin,    ext: "" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # the sqlx macros check the queries against a database at compile time
      DATABASE_URL: sqlite://${{ github.workspace }}/db_v2.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The tag matches the version of Cargo.toml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in sctg-v*) ;; *) echo "::error::the tag must start with sctg-v"; exit 1;; esac
          version="${TAG#sctg-v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::the tag says $version but Cargo.toml says $cargo_version: the binaries would report the wrong version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ matrix.target }}

      # The web console and the API documentation are embedded in the binaries
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # libsodium-sys bundles x64 and x86 libraries for MSVC only: on arm64 the linker rejects them ("library machine
      # type 'x64' conflicts with target machine type 'ARM64'"). Build libsodium for arm64 with vcpkg (static, static
      # C runtime, like the RUSTFLAGS below) and point the crate at it.
      - name: libsodium for Windows arm64
        if: ${{ matrix.os_name == 'windows' && matrix.arch == 'aarch64' }}
        run: |
          root="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          "$root/vcpkg.exe" install libsodium:arm64-windows-static
          lib="$root/installed/arm64-windows-static/lib"
          ls -l "$lib"
          echo "SODIUM_LIB_DIR=$lib" >> "$GITHUB_ENV"

      # Windows: link the C runtime statically, so that the binaries do not need the Visual C++ redistributable
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.os_name == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: The binaries run and report the version
        run: |
          bin="target/${{ matrix.target }}/release"
          for b in hbbs hbbr rustdesk-utils; do ls -l "$bin/$b${{ matrix.ext }}"; done
          "$bin/rustdesk-utils${{ matrix.ext }}" genkeypair > /dev/null
          "$bin/hbbs${{ matrix.ext }}" --version | tee version.txt
          grep -q "$VERSION" version.txt || { echo "::error::hbbs does not report $VERSION"; exit 1; }

      # Windows only: the .exe files are signed by SignPath (OSS program), so that the archives and the winget zips
      # hold signed programs and their SHA-256 sums are the ones of the signed files.
      # SignPath does not take a file from us: it downloads from GitHub the artifact we upload here, which is how it
      # checks that the files come from this repository and this run. The artifact holds the three .exe only.
      # The API token is stored in 1Password; the organisation secret OP_SERVICE_ACCOUNT_TOKEN reads its vault.
      - name: Load the SignPath token from 1Password
        if: ${{ matrix.os_name == 'windows' }}
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIGNPATH_API_TOKEN: op://GitHub SCTG-Development/y7imec4bh6vvscatjhvqstoutq/identifiant

      - name: Collect the unsigned executables
        if: ${{ matrix.os_name == 'windows' }}
        run: |
          mkdir -p signpath/unsigned
          for b in hbbs hbbr rustdesk-utils; do cp "target/${{ matrix.target }}/release/$b.exe" signpath/unsigned/; done

      - name: Upload the unsigned executables for SignPath
        if: ${{ matrix.os_name == 'windows' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: signpath/unsigned/*.exe
          retention-days: 1
          if-no-files-found: error

      # The signing policy is test-signing until SignPath validates the project; then set the repository variable
      # SIGNPATH_SIGNING_POLICY to release-signing (no edit of this file).
      - name: Sign the executables with SignPath
        if: ${{ matrix.os_name == 'windows' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: 3afe2c7a-e2db-4dfc-9cb0-9a77ee8de07e
          project-slug: sctgdesk-server
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed

      # The signed files replace the unsigned ones before they are archived. A file that is not signed (or whose
      # signature is broken) fails the job: an unsigned binary must never reach a release by accident.
      - name: Use the signed executables
        if: ${{ matrix.os_name == 'windows' }}
        shell: pwsh
        run: |
          foreach ($b in 'hbbs', 'hbbr', 'rustdesk-utils') {
            $signed = "signpath/signed/$b.exe"
            if (-not (Test-Path $signed)) { throw "$signed is missing from the signed artifact" }
            $sig = Get-AuthenticodeSignature $signed
            # release-signing: the chain must be trusted (Valid). test-signing uses an untrusted test certificate, so only
            # check that a signature exists and matches the file.
            $release = "${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}" -eq 'release-signing'
            $ok = if ($release) { $sig.Status -eq 'Valid' } else { $sig.SignerCertificate -and $sig.Status -notin 'NotSigned', 'HashMismatch' }
            if (-not $ok) { throw "$signed is not validly signed: $($sig.Status)" }
            Write-Host "$b.exe signed by $($sig.SignerCertificate.Subject)"
            Copy-Item $signed "target/${{ matrix.target }}/release/$b.exe" -Force
          }

      - name: The signed binaries still run
        if: ${{ matrix.os_name == 'windows' }}
        run: |
          bin="target/${{ matrix.target }}/release"
          "$bin/hbbs.exe" --version | grep -q "$VERSION"

      - name: Archive
        run: |
          name="sctgdesk-server-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          for b in hbbs hbbr rustdesk-utils; do cp "$bin/$b${{ matrix.ext }}" "dist/$name/"; done
          cp LICENSE "dist/$name/"
          # winget wants the programs at the root of the zip (the path of its nested installers must not hold the
          # version, or each release would need its manifests rewritten by hand): a second, flat archive
          if [ "${{ matrix.os_name }}" = windows ]; then
            mkdir "dist/winget"
            for b in hbbs hbbr rustdesk-utils; do cp "$bin/$b${{ matrix.ext }}" dist/winget/; done
            cp LICENSE dist/winget/
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/winget/*' -DestinationPath 'dist/sctgdesk-server-${VERSION}-winget-${{ matrix.arch }}.zip'"
            rm -rf dist/winget
          fi
          cd dist
          if [ "${{ matrix.os_name }}" = windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            zip -qr "$name.zip" "$name"
          fi
          rm -rf "$name"
          ls -l

      # Only to hand the archives to the publish job; deleted after a day
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Upload to the pre-release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true
      - name: Create the pre-release if needed, then upload
        run: |
          cd dist
          sha256sum ./*.zip | tee SHA256SUMS-windows-macos
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # the Linux packages workflow may create it at the same time
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$TAG" \
              --notes "Pre-release. Binaries of hbbs, hbbr and rustdesk-utils. SHA-256 sums in SHA256SUMS-*." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.zip SHA256SUMS-windows-macos
