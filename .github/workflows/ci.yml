name: CI

on:
  push:
    branches: [main, master, tcpserver-master-build, "feat/**", "chore/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The server crates need a database at compile time (sqlx macros).
  DATABASE_URL: sqlite://${{ github.workspace }}/db_v2.sqlite3
  # Rust jobs do not need Node.js; the web job builds the console and API docs.
  SCTGDESK_SKIP_WEB_BUILD: "1"

jobs:
  rust:
    name: fmt, clippy, build, test
    runs-on: ubuntu-26.04
    steps:
      # libs/hbb_common is a submodule
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Only our crates are checked: the root crate and libs/hbb_common are upstream code
      # and are kept untouched to make upstream merges cheap (see docs/adr/0005).
      - name: rustfmt (crates/*)
        run: |
          for c in crates/*/; do
            cargo fmt --manifest-path "$c/Cargo.toml" -- --check
          done
      - name: clippy (crates/*, deny-by-default lints only)
        run: |
          for c in crates/*/; do
            cargo clippy --locked --manifest-path "$c/Cargo.toml"
          done
      - name: build
        run: cargo build --workspace --locked
      # test_nat64: upstream hbb_common test that needs DNS64 and network access.
      - name: test
        run: cargo test --workspace --locked --no-fail-fast -- --skip test_nat64
      # If tests pass, upload the build artifacts for manual testing
      - uses: actions/upload-artifact@v7
        with:
          name: test-build-artifacts
          path: |
            target/debug/hbbs
            target/debug/hbbr
            target/debug/rustdesk-utils
            target/debug/sctgdesk-api-server

  web:
    name: web console and API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: web/console
        working-directory: web/console
        run: |
          npm install --force
          npm run build
      - name: web/rapidoc
        working-directory: web/rapidoc
        run: |
          npm install --force
          npm run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # The advisories that cannot be fixed from this repository are listed, with the reason, in
    # .cargo/audit.toml. Any other one fails the job.
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
