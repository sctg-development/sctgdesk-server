name: Client web build

# The web client and its landing page (client.html, with the download links of the desktop clients).
# Upstream dropped the sources of its web client after 1.4.0, so this one is built from
# client/UPSTREAM_TAG_WEB with client/web-overlay (see client/README.md).
#
# - On a pull request touching the web build it only builds, to check that it still works.
# - By hand it also copies the archives to S3.
# - Cloudflare Pages is only updated by hand and when `publish` is ticked: it replaces the live page.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Cloudflare Pages (replaces the live page)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/client-web.yml"
      - "client/UPSTREAM_TAG_WEB"
      - "client/web-overlay/**"
      - "client/branding.py"
      - "client/apply.sh"

permissions:
  contents: read
  deployments: write

env:
  # the one of upstream 1.2.5 (flutter-build.yml of that tag), the web sources of UPSTREAM_TAG_WEB
  FLUTTER_VERSION: "3.19.6"
  RELEASE_NAME: web-basic
  APP_NAME: ${{ secrets.APP_NAME }}
  APP_NAME_LOW: ${{ secrets.APP_NAME_LOW }}
  ORG_NAME: ${{ secrets.ORG_NAME }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  API_SERVER: ${{ secrets.API_SERVER }}

jobs:
  build-web:
    name: build the web client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@v4
        with:
          path: _mono

      - name: Prepare the web tree (upstream tag + web overlay)
        shell: bash
        run: |
          _mono/client/apply.sh _client web
          echo "VERSION=$(tr -d '[:space:]' < _mono/client/UPSTREAM_TAG_WEB)" >> "$GITHUB_ENV"
          shopt -s dotglob
          mv _client/* .

      - name: Brand the tree
        run: python3 branding.py --web

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build the web client
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python-is-python3

          # https://rustdesk.com/docs/en/dev/build/web/
          pushd flutter/web/js
          npm install protoc -g
          # Its yarn.lock is a Yarn 3 lockfile (TypeScript 4.5, Vite 2.7 pinned). The preinstalled
          # Yarn 1 ignores it and installs today's @types/node, which TypeScript 4 cannot parse.
          curl -fsSL -o "$RUNNER_TEMP/yarn.cjs" https://repo.yarnpkg.com/3.8.7/packages/yarnpkg-cli/bin/yarn.js
          export YARN_ENABLE_IMMUTABLE_INSTALLS=false YARN_ENABLE_TELEMETRY=0
          node "$RUNNER_TEMP/yarn.cjs" install
          node "$RUNNER_TEMP/yarn.cjs" build
          popd

          pushd flutter/web
          wget https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz
          popd

          cd flutter
          flutter build web --release --source-maps
          flutter build web --source-maps --profile --dart-define=Dart2jsOptimization=O0 --dart2js-optimization=O1 -o build/web-debug
          cd build

          # the landing page becomes index.html, the web client is sctgdesk.html
          for dir in web web-debug; do
            mv "$dir/index.html" "$dir/sctgdesk.html"
            mv "$dir/client.html" "$dir/index.html"
          done
          dir_name="${APP_NAME_LOW}-${VERSION}-${RELEASE_NAME}"
          mv web "$dir_name"
          mv web-debug "${dir_name}-debug"
          for d in "$dir_name" "${dir_name}-debug"; do
            tar czf "$d.tar.gz" "$d"
            (cd "$d" && zip -q -9 -r "../$d.zip" .)
            sha256sum "$d.tar.gz"
          done
          echo "WEB_DIR=$dir_name" >> "$GITHUB_ENV"

      # The archives embed the address of the rendezvous server and this repository is public:
      # they go to S3 only, never to a workflow artifact or a release.
      - name: Copy the archives to S3
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd flutter/build
          curl -fsSL -o mc https://dl.min.io/aistor/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set s3release "https://${{ secrets.AWS_S3_ENDPOINT }}" "${{ secrets.AWS_ACCESS_KEY_ID }}" "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          for f in "${WEB_DIR}.tar.gz" "${WEB_DIR}.zip"; do
            ./mc cp "$f" "s3release/${{ secrets.AWS_S3_BUCKET }}/${APP_NAME_LOW}-releases/$f"
          done

      # The custom domain of a Pages project serves its production branch only: a deployment to any other
      # branch is a preview. The tree here is upstream's clone, in a detached HEAD, so without a branch the
      # action deploys to "HEAD" and the live page does not change. Ask the project which branch is its own.
      - name: Find the production branch of the Pages projects
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          production_branch() {
            curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$1" | jq -er '.result.production_branch'
          }
          main=$(production_branch "$CF_PROJECT")      # must exist: a failure stops here
          debug=$(production_branch "$CF_PROJECT-debug" || true)
          echo "production branch: $main (debug project: ${debug:-none})"
          echo "PAGES_BRANCH=$main" >> "$GITHUB_ENV"
          echo "PAGES_BRANCH_DEBUG=$debug" >> "$GITHUB_ENV"

      - name: Publish to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: sctg-development/pages-action-without-url@main
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: flutter/build/${{ env.WEB_DIR }}
          branch: ${{ env.PAGES_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly if it still was not a production deployment, instead of leaving the old page up.
      - name: Check that the live page was replaced
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          environment=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT" | jq -er '.result.latest_deployment.environment')
          echo "latest deployment: $environment"
          [ "$environment" = production ] || { echo "::error::the deployment is a $environment one, the live page did not change"; exit 1; }

      - name: Publish the debug build to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: sctg-development/pages-action-without-url@main
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}-debug
          directory: flutter/build/${{ env.WEB_DIR }}-debug
          branch: ${{ env.PAGES_BRANCH_DEBUG }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
